[package]
name = "bqlite-benches"
description = "Criterion benchmarks for the bqlite query engine. Not published."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The lib target exists only so the `common` helper module — which is
# specified at `benches/common/mod.rs` by TASKS.md — can be exposed to
# every Criterion bench file via `use bqlite_benches::common::*`. No
# production code lives here.
[lib]
path = "src/lib.rs"

[dependencies]
bqlite-core = { workspace = true }
bqlite-storage = { workspace = true }
arrow = { workspace = true }
criterion = { workspace = true }
serde_json = { workspace = true }

# Wave 1 smoke benchmark — exercises the Criterion harness in CI so that
# later waves can drop microbenchmarks in without rediscovering the
# wiring. Every subsequent bench follows the same `[[bench]]` pattern:
# one entry per file under `benches/benches/`, always with
# `harness = false` so Criterion drives execution instead of libtest.
[[bench]]
name = "smoke"
harness = false

# Wave 2 benchmark suite (TASK-236). Four benches covering the Wave 2
# performance gate targets from TASKS.md.
[[bench]]
name = "encoding"
path = "wave2/encoding.rs"
harness = false

[[bench]]
name = "scan"
path = "wave2/scan.rs"
harness = false

[[bench]]
name = "ingest"
path = "wave2/ingest.rs"
harness = false

[[bench]]
name = "acceptance"
path = "wave2/acceptance.rs"
harness = false
