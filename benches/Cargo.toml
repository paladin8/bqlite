[package]
name = "bqlite-benches"
description = "Criterion benchmarks for the bqlite query engine. Not published."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The lib target exists only so the `common` helper module — which is
# specified at `benches/common/mod.rs` by TASKS.md — can be exposed to
# every Criterion bench file via `use bqlite_benches::common::*`. No
# production code lives here.
[lib]
path = "src/lib.rs"

[dependencies]
bqlite-ast = { workspace = true }
bqlite-core = { workspace = true }
bqlite-storage = { workspace = true }
bqlite-operators = { workspace = true }
bqlite-planner = { workspace = true }
bqlite-engine = { workspace = true }
arrow = { workspace = true }
criterion = { workspace = true }
parquet = { workspace = true }
pprof = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
compact_str = { workspace = true }
fsst = { workspace = true }

# Wave 1 smoke benchmark — exercises the Criterion harness in CI so that
# later waves can drop microbenchmarks in without rediscovering the
# wiring. Every subsequent bench follows the same `[[bench]]` pattern:
# one entry per file under `benches/benches/`, always with
# `harness = false` so Criterion drives execution instead of libtest.
[[bench]]
name = "smoke"
harness = false

# Wave 2 benchmark suite (TASK-236). Four benches covering the Wave 2
# performance gate targets from TASKS.md.
[[bench]]
name = "encoding"
path = "wave2/encoding.rs"
harness = false

[[bench]]
name = "scan"
path = "wave2/scan.rs"
harness = false

[[bench]]
name = "scan_encoded"
path = "wave2/scan_encoded.rs"
harness = false

[[bench]]
name = "ingest"
path = "wave2/ingest.rs"
harness = false

[[bench]]
name = "acceptance"
path = "wave2/acceptance.rs"
harness = false

# TASK-519: operator-level FusedStatelessSegment microbenches per
# `engine/operator-fusion.md` §7.2.
[[bench]]
name = "fused_segment"
path = "wave2/fused_segment.rs"
harness = false

# Wave 3 benchmark: DDSketch percentile throughput (TASK-327).
[[bench]]
name = "percentile"
path = "wave3/percentile.rs"
harness = false

# Wave 3 benchmark suite (TASK-325).
[[bench]]
name = "matcher"
path = "wave3/matcher.rs"
harness = false

[[bench]]
name = "aggregate"
path = "wave3/aggregate.rs"
harness = false

[[bench]]
name = "wave3_sort"
path = "wave3/sort.rs"
harness = false

[[bench]]
name = "wave3_distinct"
path = "wave3/distinct.rs"
harness = false

[[bench]]
name = "funnel"
path = "wave3/funnel.rs"
harness = false

# CompactString evaluation microbenchmark (TASK-332).
# Run with: cargo bench -p bqlite-benches --bench compactstring_eval
[[bench]]
name = "compactstring_eval"
path = "wave3/compactstring_eval.rs"
harness = false

# Profiling binary for funnel query analysis (TASK-331).
# Run with: cargo run -p bqlite-benches --release --example funnel_profile
[[example]]
name = "funnel_profile"
path = "wave3/funnel_profile.rs"

# Wave 4 benchmarks.
[[bench]]
name = "sessionize"
path = "wave4/sessionize.rs"
harness = false

# Wave 4 benchmark: AttributeOperator throughput (TASK-431, §17.1).
# Run with: cargo bench -p bqlite-benches --bench attribute
[[bench]]
name = "attribute"
path = "wave4/attribute.rs"
harness = false

# Wave 4 EventSelectOperator throughput benchmarks (TASK-429, TASK-531).
# Property tests and CI/reference-mode hard targets added in TASK-531.
[[bench]]
name = "event_select"
path = "wave4/event_select.rs"
harness = false

# PFOR codec (TASK-450) — encode/decode throughput and payload-size
# ratio evidence per advanced-encodings.md §6.
[[bench]]
name = "pfor"
path = "wave4/pfor.rs"
harness = false

# Wave 4 advanced-encoding comparison matrix (TASK-441) — ALP coverage
# plus same-fixture head-to-head plots for the Wave 4 integer and
# string encodings. Frequency encoding is intentionally skipped
# (advanced-encodings.md §9.5 is NO-GO).
[[bench]]
name = "encoding_matrix"
path = "wave4/encoding_matrix.rs"
harness = false

# Wave 4 ingest benches (TASK-441): JSONL + Parquet end-to-end
# throughput. Named `wave4_ingest` to avoid colliding with the
# Wave 2 `ingest` bench (CSV) registered above.
[[bench]]
name = "wave4_ingest"
path = "wave4/ingest.rs"
harness = false

# Wave 4 compaction bench (TASK-441): L0-to-L1 throughput and L0
# segment-fan-in reduction measurement via `Database::compact_now`.
[[bench]]
name = "compaction"
path = "wave4/compaction.rs"
harness = false

# Wave 4 SAMPLE pushdown bench (TASK-441): per-row xxHash64 +
# threshold throughput on entity-id columns, plus selectivity
# determinism within the 3σ law-of-large-numbers bound.
[[bench]]
name = "sample"
path = "wave4/sample.rs"
harness = false

# Wave 4 cohort + joined-source bench (TASK-441): probe throughput
# for `SubqueryFilterOperator` against sized cohorts, plus
# `MergeSourcesOperator` k-way merge overhead vs a single-scan
# baseline.
[[bench]]
name = "cohort_join"
path = "wave4/cohort_join.rs"
harness = false

# Wave 4 tombstone scan filter microbenchmark (TASK-534): query-time
# TombstoneFilter::filter_batch_with_index throughput across five
# tombstone configurations, plus compaction-time Database::compact_now
# overhead at 1% / 5% / 10% entity-tombstone density.
[[bench]]
name = "tombstone_scan"
path = "wave4/tombstone_scan.rs"
harness = false

# Wave 5 zero-copy scan/filter copy-budget bench (TASK-526). Reports
# `bytes_materialized_before_filter` and `bytes_decompressed` against
# the targets in `docs/design/storage/zero-copy-scan-filter.md` §3.
[[bench]]
name = "zero_copy_scan"
path = "wave5/zero_copy_scan.rs"
harness = false

# Wave 5 stateful-to-aggregate fusion bench (TASK-526, TASK-520).
# Compares SESSIONIZE → STATS throughput between fusion-eligible and
# fusion-ineligible queries to surface regressions in the TASK-520
# inline-accumulator path.
[[bench]]
name = "stateful_aggregate_fusion"
path = "wave5/stateful_aggregate_fusion.rs"
harness = false

# Wave 5 morsel scheduler skew bench (TASK-526). Wall-clock
# regression tripwire for skewed-vs-balanced entity distributions.
# v1 morsel scheduler records all-zero per-worker snapshots so
# entity_event_skew_p99 isn't usefully assertable yet — the bench
# guards the wall-clock axis.
[[bench]]
name = "morsel_skew"
path = "wave5/morsel_skew.rs"
harness = false

# Wave 5 sort spill overhead bench (TASK-526). Compares
# SortOperator::with_spill against the in-memory baseline to
# surface regressions in the TempSpillFile drain + k-way merge
# path landed under TASK-502 / TASK-513.
[[bench]]
name = "spill_overhead"
path = "wave5/spill_overhead.rs"
harness = false

# Wave 5 cohort pushdown savings bench (TASK-526). Compares
# bytes_scanned between a ScanOperator with an EntityIn conjunct
# (TASK-522 pushdown) and the same scan without the conjunct.
[[bench]]
name = "cohort_pushdown"
path = "wave5/cohort_pushdown.rs"
harness = false

# ─────────────────────────────────────────────────────────────────────────────
# `bench-perf` headline-throughput suite (TASK-546). Sized by
# BQLITE_BENCH_SCALE (small=1M / medium=100M / large=1B / xlarge=10B);
# fixtures are materialised once per (scale, seed, schema_version) and
# cached under $BQLITE_BENCH_CACHE_DIR. See `docs/design/perf-suite.md`.
[[bench]]
name = "perf_scan_selectivity"
path = "perf/scan_selectivity.rs"
harness = false

[[bench]]
name = "perf_aggregation_cardinality"
path = "perf/aggregation_cardinality.rs"
harness = false

[[bench]]
name = "perf_funnel_depth"
path = "perf/funnel_depth.rs"
harness = false

[[bench]]
name = "perf_sort_topk"
path = "perf/sort_topk.rs"
harness = false

[[bench]]
name = "perf_ingest_throughput"
path = "perf/ingest_throughput.rs"
harness = false

[[bench]]
name = "perf_mc_scaling"
path = "perf/mc_scaling.rs"
harness = false

[[bench]]
name = "perf_concurrent_queries"
path = "perf/concurrent_queries.rs"
harness = false

[[bench]]
name = "perf_memory_pressure"
path = "perf/memory_pressure.rs"
harness = false

# TASK-546 Phase 3 — collects per-bench JSON from
# `target/bench-results.json` and writes the consolidated markdown
# report to `docs/perf/wave5-results.md`.
[[bin]]
name = "perf_report"
path = "src/bin/perf_report.rs"

# Per-core profiling driver. Pair with samply / cargo flamegraph.
[[bin]]
name = "perf_profile"
path = "src/bin/perf_profile.rs"

# Debug helper: dumps per-column encoding distribution for the `small`
# purchases fixture, so we can see which lazy decoders are worth
# writing without grepping the writer's encoding selector.
[[bin]]
name = "dump_encodings"
path = "src/bin/dump_encodings.rs"
