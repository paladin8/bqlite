[package]
name = "bqlite-tests"
description = "Workspace-level property and integration tests for bqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autobins = false
autoexamples = false
autobenches = false

# This package's source layout:
#
#   src/lib.rs        — re-exports `common` (test helpers) and `strategies`
#                       (proptest strategies). Cargo auto-discovers it.
#   tests/*.rs        — one integration-test binary per file. Cargo
#                       auto-discovers everything in tests/, so adding a
#                       new test file requires zero manifest changes.
#
# `bqlite-tests` is `publish = false` and lives outside the dep-direction
# graph enforced by `scripts/check-dep-direction.sh` (which walks
# `crates/*/` only). Adding deps here is not a rule bypass.

[dependencies]
arrow = { workspace = true }
bqlite-core = { workspace = true }
proptest = { workspace = true }
thiserror = { workspace = true }

# Wave 1 end-to-end smoke test (TASK-123). Spawns the compiled
# `bqlite` binary as a subprocess and exercises the full parse →
# plan → bind → drive pipeline plus the CLI's arg parser, tracing
# init, and text renderer. This is the Wave 1 acceptance gate —
# `cargo test --all-targets` is what local-ci.sh runs, and that
# command builds the CLI binary as a prerequisite so the subprocess
# always finds it under `target/<profile>/`.
[[test]]
name = "smoke"
path = "smoke.rs"

[dev-dependencies]
serde_json = { workspace = true }
