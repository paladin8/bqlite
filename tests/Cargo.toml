[package]
name = "bqlite-tests"
description = "Workspace-level property and integration tests for bqlite"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

# Explicit test targets. This package intentionally has no lib/bin — it
# exists only to host workspace-level tests whose file layout (tests/prop/,
# tests/suite/, tests/smoke.rs, ...) does not match Cargo's default target
# auto-discovery. Every test file is listed here with an explicit path.
[[test]]
name = "prop_property_value"
path = "prop/property_value.rs"

[[test]]
name = "prop_time"
path = "prop/time.rs"

[[test]]
name = "prop_arrow"
path = "prop/arrow.rs"

# Self-test for the helpers in `tests/common/mod.rs` — doubles as the
# canonical `#[path]`-include template for every future test file under
# `tests/` (TASK-120).
[[test]]
name = "common_smoke"
path = "common_smoke.rs"

# Wave 1 end-to-end smoke test (TASK-123). Spawns the compiled
# `bqlite` binary as a subprocess and exercises the full parse →
# plan → bind → drive pipeline plus the CLI's arg parser, tracing
# init, and text renderer. This is the Wave 1 acceptance gate —
# `cargo test --all-targets` is what local-ci.sh runs, and that
# command builds the CLI binary as a prerequisite so the subprocess
# always finds it under `target/<profile>/`.
[[test]]
name = "smoke"
path = "smoke.rs"

[dev-dependencies]
bqlite-core = { workspace = true }
arrow = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
