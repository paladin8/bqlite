[package]
name = "bqlite-storage"
description = "Native storage engine: segments, WAL, memtable, compaction, entity-major layout"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
bqlite-core = { workspace = true }
arrow = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
twox-hash = { workspace = true }
lz4_flex = { workspace = true }
postcard = { workspace = true }
csv = { workspace = true }

# `libc` is only pulled in on platforms where the segment reader emits
# an OS-specific sequential-read hint: `posix_fadvise(2)` on
# Linux/FreeBSD/Android and Darwin's `fcntl(F_RDADVISE)` on Apple
# targets. Other platforms keep the advisory hook as a no-op — see
# `src/segment/advise.rs`.
[target.'cfg(any(target_os = "linux", target_os = "freebsd", target_os = "android", target_vendor = "apple"))'.dependencies]
libc = "0.2"
