[workspace]
members = [
    "crates/bqlite",
    "crates/bqlite-core",
    "crates/bqlite-ast",
    "crates/bqlite-storage",
    "crates/bqlite-parser",
    "crates/bqlite-planner",
    "crates/bqlite-operators",
    "crates/bqlite-engine",
    "crates/bqlite-cli",
    "crates/bqlite-ffi",
    "benches",
    "tests",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/paladin8/bqlite"

[workspace.dependencies]
# Internal crates
bqlite-core = { path = "crates/bqlite-core" }
bqlite-ast = { path = "crates/bqlite-ast" }
bqlite-storage = { path = "crates/bqlite-storage" }
bqlite-parser = { path = "crates/bqlite-parser" }
bqlite-planner = { path = "crates/bqlite-planner" }
bqlite-operators = { path = "crates/bqlite-operators" }
bqlite-engine = { path = "crates/bqlite-engine" }
bqlite-ffi = { path = "crates/bqlite-ffi" }

# External dependencies
ahash = "0.8"
arrow = "54"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
proptest = "1"
criterion = { version = "0.5", features = ["html_reports"] }
pprof = { version = "0.14", default-features = false, features = ["flamegraph", "criterion"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
smallvec = { version = "1", features = ["const_generics"] }
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }
lz4_flex = { version = "0.13", default-features = false, features = ["safe-encode", "safe-decode", "std"] }
# `postcard` is pinned to an exact version because the v1 segment file
# format (docs/design/storage/segment-format-v1.md §10.4) defines its
# footer body as "whatever postcard 1.0 produces". Any postcard wire
# format break forces a segment format-version bump; leaving the version
# floating would silently break segment compatibility the moment a
# dependency minor-bumps postcard.
postcard = { version = "=1.1.3", default-features = false, features = ["use-std"] }
csv = "1"
